version: '3.9'

services:
  backend:
    build: ./backend
    container_name: medai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models/weights:/app/models/weights
      - ./backend/rag/faiss_medical_index:/app/rag/faiss_medical_index
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: medai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
