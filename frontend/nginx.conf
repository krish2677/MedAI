# ── Nginx production config for MedAI frontend ───────────────────────────────
# Serves the React SPA and proxies /api/* to the backend

# Connection rate limiting — 20 req/s per IP burst, 10 req/s sustained
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;                          # catch-all; Vercel handles the real domain

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options            "DENY"                      always;
    add_header X-Content-Type-Options     "nosniff"                   always;
    add_header X-XSS-Protection           "1; mode=block"             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'unsafe-inline'; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "font-src 'self' https://fonts.gstatic.com; "
        "img-src 'self' data: blob:; "
        "connect-src 'self' https://medai-api-exye.onrender.com; "
        "frame-ancestors 'none';"
        always;

    # Hide Nginx version from response headers
    server_tokens off;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff2;

    # ── Request Size Limit ────────────────────────────────────────────────────
    client_max_body_size 12m;             # slightly above backend 10MB for multipart overhead

    # ── Timeouts ─────────────────────────────────────────────────────────────
    client_body_timeout   30s;
    client_header_timeout 10s;
    keepalive_timeout     65s;
    send_timeout          30s;

    # ── Static assets with aggressive caching ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webmanifest)$ {
        limit_req zone=static_limit burst=60 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API Proxy to backend ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        # Allow longer timeouts for ML analysis (up to 2 min)
        proxy_read_timeout    130s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;

        # Disable buffering for SSE / streaming responses
        proxy_buffering off;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|htaccess|htpasswd)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # ── SPA catch-all: serve index.html for all React routes ─────────────────
    location / {
        limit_req zone=static_limit burst=30 nodelay;
        try_files $uri $uri/ /index.html;

        # SPA HTML: no caching to ensure fresh builds are served
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Custom error pages ────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
