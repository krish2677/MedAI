services:
  - type: web
    name: medai-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free # Changed to the completely free tier
    region: ohio
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: false
