name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Ping every 10 minutes (Render sleeps after 15m)
  workflow_dispatch:        # Allow manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging MedAI Backend..."
          curl -f -s -m 15 https://medai-api-tivz.onrender.com/api/v1/health || exit 0
          echo "Backend is alive!"
